/* ═══════════════════════════════════════════════

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
  --violet:#6D4AAE; --orchid:#C1499B; --sky:#4A87C7; --teal:#23A6A0; --emerald:#4CAF6D;
  --grad:linear-gradient(120deg,#6D4AAE,#C1499B 28%,#4A87C7 55%,#23A6A0 78%,#4CAF6D);

  --bg:#FAF7F0; --surface:#FFFFFF; --surface-2:#F4EFE3;
  --text:#26221A; --text-soft:#6E6756; --text-faint:#9A9280;
  --border:#E9E2D0; --code-bg:#191D12; --code-text:#E9E4D5;
  --shadow:0 10px 30px -12px rgba(38,34,26,.16);
  --shadow-lg:0 20px 44px -14px rgba(38,34,26,.25);
  --radius:16px; --radius-sm:12px; --navH:58px;
  --font-mono:'Fira Code','Cascadia Mono',Consolas,monospace;
  --tr:all .28s cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#12160D; --surface:#1B2113; --surface-2:#171B10;
  --text:#F1EDE1; --text-soft:#B6B09E; --text-faint:#847F70;
  --border:#2C3320; --code-bg:#0D110A; --code-text:#E4E0D2;
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-lg:0 20px 44px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}
html[lang="ar"]{--font-display:'Cairo Play','Fraunces',serif;--font-body:'Almarai','Nunito Sans',sans-serif}
html[lang="en"]{--font-display:'Fraunces','Cairo Play',serif;--font-body:'Nunito Sans','Almarai',sans-serif}

body{
  font-family:var(--font-body); background:var(--bg); color:var(--text);
  line-height:1.7; min-height:100vh; overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
h1,h2,.brand-name,.f-motto{font-family:var(--font-display)}
code,pre,kbd,.command-name{font-family:var(--font-mono)}

/* ─── Haloa / الهالات الخلفية ─── */
.bg-glow{position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.5;transition:opacity .4s}
html[data-theme="dark"] .bg-glow{opacity:.25}
.glow-1{width:480px;height:480px;background:var(--violet);top:-160px;inset-inline-start:-140px}
.glow-2{width:420px;height:420px;background:var(--teal);top:34%;inset-inline-end:-170px}
.glow-3{width:460px;height:460px;background:var(--orchid);bottom:-180px;inset-inline-start:28%}

/* ─── أدوات ─── */
.gradient-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--orchid);outline-offset:2px;border-radius:6px}
::selection{background:rgba(193,73,155,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--violet),var(--teal));border-radius:99px;border:2px solid var(--bg)}
mark{background:rgba(35,166,160,.32);color:inherit;border-radius:4px;padding:0 .1em}

/* ─── شريط التقدم ─── */
.progress{position:fixed;top:0;inset-inline-start:0;height:4px;width:0;background:var(--grad);z-index:80;transition:width .1s linear}

/* ─── Navbar (صلب — بدون glass) ─── */
.nav{position:sticky;top:0;z-index:60;height:var(--navH);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding-inline:clamp(.8rem,3vw,2rem);transition:background .3s}
.brand{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none}
.brand img{width:34px;height:34px;transition:transform .3s}
.brand:hover img{transform:rotate(8deg) scale(1.08)}
.brand-name{font-weight:800;font-size:1.05rem}
.nav-actions{display:flex;gap:.5rem}
.nav-btn{min-width:44px;min-height:36px;border-radius:12px;cursor:pointer;font:inherit;font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;transition:var(--tr)}
.nb-ghost{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;color:var(--text)}
.nb-plain{border:2px solid var(--border);background:var(--surface);font-size:1.02rem}
.nav-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* ─── Hero ─── */
.hero{text-align:center;padding:3rem 1rem 2rem;max-width:920px;margin:0 auto}
.eyebrow{display:inline-flex;gap:.45rem;align-items:center;padding:.35rem 1rem;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-soft);font-size:.85rem;font-weight:700}
.hero h1{font-size:clamp(2.1rem,6vw,3.2rem);font-weight:800;margin:1rem 0 .4rem;line-height:1.3}
.hero-sub{color:var(--text-soft);max-width:62ch;margin:0 auto}
.hero-actions{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem}

/* ─── بحث ─── */
.search-wrap{position:relative;max-width:640px;margin:1.6rem auto 0;width:100%}
.search-input{width:100%;padding-block:.95rem;padding-inline-start:3rem;padding-inline-end:4.8rem;border-radius:var(--radius);border:2px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:1rem;transition:var(--tr)}
.search-input::placeholder{color:var(--text-faint)}
.search-input:focus{outline:none;border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;box-shadow:0 0 0 4px rgba(193,73,155,.16)}
.s-icon{position:absolute;inset-inline-start:1rem;top:50%;translate:0 -50%;pointer-events:none}
.s-kbd{position:absolute;inset-inline-end:.9rem;top:50%;translate:0 -50%;font-size:.68rem;color:var(--text-faint);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:.12rem .45rem;background:var(--surface-2);pointer-events:none}

/* ─── أزرار ─── */
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.65rem 1.3rem;border-radius:999px;font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;border:none;transition:var(--tr)}
.btn-grad{background:var(--grad);background-size:160% 100%;color:#fff}
.btn-grad:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(109,74,174,.55)}
.btn-ghost{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;color:var(--text)}
.btn-ghost:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* ─── إحصائيات ─── */
.stats{display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem}
.stat{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:.4rem 1rem;font-size:.85rem;color:var(--text-soft)}
.stat b{font-size:1.02rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ─── أمر اليوم ─── */
.cotd-row{display:flex;justify-content:center;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:1.3rem}
.cotd{display:inline-flex;align-items:center;gap:.7rem;padding:.55rem 1.15rem;border-radius:999px;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;cursor:pointer;font:inherit;transition:var(--tr)}
.cotd:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cotd-label{font-size:.75rem;font-weight:800;color:var(--text-faint)}
.cotd code{direction:ltr;font-weight:700;font-size:1rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cotd-desc{color:var(--text-soft);font-size:.85rem}
.cotd-dice{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:1rem;transition:var(--tr)}
.cotd-dice:hover{transform:rotate(25deg) scale(1.08);border-color:var(--teal)}

/* ─── تبويبات المستويات ─── */
.tabs{position:sticky;top:var(--navH);z-index:50;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:.5rem;padding:.7rem 1rem;flex-wrap:wrap;transition:background .3s}
.tab{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.15rem;border-radius:999px;border:2px solid var(--border);background:var(--surface);color:var(--text-soft);font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:var(--tr)}
.tab:hover{transform:translateY(-2px);border-color:var(--teal)}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(109,74,174,.45)}

/* ─── الحاوية وعناوين الأقسام ─── */
.container{max-width:1100px;margin:0 auto;padding:1.4rem 1rem 0}
.sec-head{margin:2.2rem 0 1rem}
.sec-head h2{font-size:1.5rem;font-weight:800;display:inline-flex;align-items:center;gap:.5rem}
.sec-head .bar{display:block;width:76px;height:5px;border-radius:3px;background:var(--grad);margin-top:.5rem}

/* ─── بطاقة الأمر (حد متدرج 2px — حيلة padding/border box) ─── */
.command-card{
  border:2px solid transparent;border-radius:20px;overflow:hidden;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;
  box-shadow:var(--shadow);margin-bottom:14px;scroll-margin-top:140px;
  transition:transform .28s cubic-bezier(.4,0,.2,1),box-shadow .28s;
}
.command-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.command-card.flash{animation:flash 1.2s ease 2}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}40%{box-shadow:0 0 0 7px rgba(35,166,160,.35)}}

.command-head{display:flex;align-items:center;gap:.7rem;width:100%;padding:1rem 1.25rem;background:none;border:none;font:inherit;color:inherit;text-align:start;cursor:pointer}
.command-head:focus-visible{outline-offset:-4px;border-radius:18px}
.command-name{direction:ltr;font-weight:700;font-size:1rem;flex:0 0 auto;transition:var(--tr)}
.command-card:hover .command-name{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.command-desc{flex:1;color:var(--text-soft);font-size:.9rem;min-width:0}
.tag{flex-shrink:0;padding:.15rem .7rem;border-radius:999px;font-size:.72rem;font-weight:800;font-family:var(--font-body)}
.tag-basic{background:rgba(76,175,109,.16);color:#2F7C46}
.tag-intermediate{background:rgba(74,135,199,.16);color:#2F639A}
.tag-advanced{background:rgba(193,73,155,.16);color:#A03379}
.tag-expert{background:rgba(109,74,174,.16);color:#5B3D95}
html[data-theme="dark"] .tag-basic{color:#8FE0A6}
html[data-theme="dark"] .tag-intermediate{color:#9CC8F0}
html[data-theme="dark"] .tag-advanced{color:#EFA7D4}
html[data-theme="dark"] .tag-expert{color:#C9B2F2}
.chev{color:var(--text-faint);transition:transform .3s;font-size:.9rem}
.command-card.open .chev{transform:rotate(180deg)}

/* فتح/طي سلس بتقنية grid-rows */
.command-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1)}
.command-card.open .command-body{grid-template-rows:1fr}
.cb-in{overflow:hidden;min-height:0}
.cb-pad{padding:.3rem 1.25rem 1.25rem}
.cmd-about{color:var(--text-soft);font-size:.92rem;margin-bottom:.8rem;padding-bottom:.7rem;border-bottom:1px dashed var(--border)}

/* ─── كود ─── */
.code-wrap{position:relative;background:var(--code-bg);border-radius:var(--radius-sm);padding:.6rem .9rem .95rem;margin-bottom:.8rem;overflow:hidden}
.cw-top{display:flex;align-items:center;gap:.4rem}
.dot{width:9px;height:9px;border-radius:50%}
.d1{background:var(--violet)} .d2{background:var(--orchid)} .d3{background:var(--teal)}
.cw-tag{margin-inline-start:.5rem;font-size:.68rem;color:#8A9480;letter-spacing:.5px}
.copy-btn{margin-inline-start:auto;background:linear-gradient(120deg,var(--violet),var(--orchid));color:#fff;border:none;border-radius:8px;padding:.32rem .8rem;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer;display:inline-flex;gap:.3rem;align-items:center;transition:var(--tr)}
.copy-btn:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.copy-btn:active{transform:scale(.96)}
.copy-btn.ok{background:linear-gradient(120deg,var(--emerald),var(--teal))}
.code-wrap pre{margin-top:.7rem;font-size:.85rem;line-height:1.75;color:var(--code-text);white-space:pre;overflow-x:auto;direction:ltr;text-align:left}
.tk-c{color:#8A9480;font-style:italic}
.tk-k{color:#C9B2F2;font-weight:600}
.tk-s{color:#EFB1D6}
.tk-f{color:#9FDCD5}
.tk-n{color:#ABE6B6}

/* ─── صناديق التلميح ─── */
.tip-box{border-inline-start:4px solid var(--emerald);background:rgba(76,175,109,.1);padding:.8rem 1rem;border-radius:var(--radius-sm);margin-top:.6rem;font-size:.86rem;color:var(--text-soft)}
.tip-box.warn{border-inline-start-color:var(--orchid);background:rgba(193,73,155,.1)}
.tip-box.info{border-inline-start-color:var(--sky);background:rgba(74,135,199,.1)}
.tip-box strong{color:var(--text)}

/* ─── لا نتائج ─── */
.no-results{text-align:center;padding:3rem 1rem;color:var(--text-faint);font-size:1.05rem}

/* ─── زر العودة للأعلى ─── */
.to-top{position:fixed;bottom:1.4rem;inset-inline-start:1.4rem;width:46px;height:46px;border-radius:50%;border:none;background:var(--grad);color:#fff;font-size:1.1rem;cursor:pointer;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(14px);transition:var(--tr);z-index:70}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{transform:translateY(-3px)}

/* ─── الفوتر ─── */
.footer{margin-top:4.5rem;padding:2.6rem 1rem 2.2rem;text-align:center;background:var(--surface-2);border-top:1px solid var(--border);transition:background .3s}
.f-bar{display:block;height:4px;width:min(420px,70%);margin:0 auto 1.6rem;background:var(--grad);border-radius:99px}
.f-logo{width:46px;height:46px;border-radius:12px;box-shadow:var(--shadow)}
.f-motto{font-size:1.25rem;font-weight:800;margin:.6rem 0 .3rem}
.f-line{color:var(--text-faint);font-size:.85rem}
.f-line a{color:var(--sky);font-weight:700;text-decoration:none}
.f-line a:hover{text-decoration:underline}

/* ─── استجابة ─── */
@media (max-width:768px){
  .command-head{flex-wrap:wrap;row-gap:.35rem;padding:.9rem 1rem}
  .command-desc{order:5;flex-basis:100%;font-size:.84rem}
  .command-name{font-size:.94rem}
  .hero{padding:2.3rem 1rem 1.6rem}
  .cb-pad{padding:.3rem 1rem 1.1rem}
}
@media (max-width:480px){
  .s-kbd{display:none}
  .search-input{padding-inline-end:3rem}

  .tab{padding:.5rem .9rem;font-size:.8rem}
  .btn{padding:.55rem 1rem;font-size:.85rem}
  .hero h1{font-size:1.7rem}
  .cotd{flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

tab_all:"All",tab_basic:"Beginner",tab_intermediate:"Intermediate",tab_advanced:"Advanced",tab_expert:"Expert",
sec_basic:"Beginner Commands",sec_intermediate:"Intermediate Commands",sec_advanced:"Advanced Commands",sec_expert:"Expert Commands",
cotd:"Command of the day",noResults:"Nothing found — try another keyword…",copy:"Copy",copied:"Copied!",
footer:"Made with love and coffee",results:"results"}};

/* ═══════════════════════════════════════════
   الحالة والأدوات
   ═══════════════════════════════════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ORDER=["basic","intermediate","advanced","expert"];
const LV={all:{e:"📚"},basic:{e:"🌱"},intermediate:{e:"🌿"},advanced:{e:"🌳"},expert:{e:"🏆"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const state={lang:localStorage.getItem("reesha-lang")||"ar",level:"all",query:"",open:new Set(["ls"])};
let cotdSeed=Math.floor(Date.now()/864e5);
const searchInput=$("#search");

/* ─── تلوين الكود تلقائياً (تعليقات/أوامر/نصوص/فلاجز/أرقام) ─── */
function hl(code){
  return code.split("\n").map(line=>{
    const t=line.trim();
    if(!t)return "";
    if(t.startsWith("#"))return '<span class="tk-c">'+esc(line)+"</span>";
    const m=line.match(/^(\s*)(\S+)/);
    if(!m)return esc(line);
    const tok=m[2];
    let head;
    if(/^-/.test(tok))head='<span class="tk-f">'+esc(tok)+"</span>";
    else if(/^[\d*]/.test(tok))head='<span class="tk-n">'+esc(tok)+"</span>";
    else head='<span class="tk-k">'+esc(tok)+"</span>";
    let rest=esc(line.slice(m[0].length));
    rest=rest.replace(/"[^"]*"|'[^']*'/g,x=>'<span class="tk-s">'+x+"</span>");
    rest=rest.replace(/(^|[\s:])(-{1,2}[A-Za-z][\w-]*)/g,'$1<span class="tk-f">$2</span>');
    rest=rest.replace(/(^|[\s:])(\d+(?:\.\d+)?[KMG]?)(?=[\s:;/]|$)/g,'$1<span class="tk-n">$2</span>');
    return head+rest;
  }).join("\n");
}

/* ─── تظليل نتائج البحث ─── */
function hi(text,q){
  const t=esc(text);
  if(!q)return t;
  const sq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return t.replace(new RegExp("("+sq+")","gi"),"<mark>$1</mark>");
}

/* ═══════════════════════════════════════════
   البناء — أقسام h2 + بطاقات
   ═══════════════════════════════════════════ */
function codeBlock(cmd){
  return `<div class="code-wrap"><div class="cw-top">
  <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
  <span class="cw-tag">bash</span>
  <button class="copy-btn" type="button">📋 ${I18N[state.lang].copy}</button>
  </div><pre><code>${hl(cmd.code)}</code></pre></div>`;
}
function tipBox(t){
  const cls=t.startsWith("⚠")?"warn":(t.startsWith("⌨")||t.startsWith("🔑")||t.startsWith("📊")||t.startsWith("📅")||t.startsWith("🐳")?"info":"");
  return `<div class="tip-box ${cls}"><strong>${esc(t)}</strong></div>`;
}
function card(cmd,q){
  const L=I18N[state.lang], lang=state.lang, open=q?true:state.open.has(cmd.id);
  const el=document.createElement("article");
  el.className="command-card"+(open?" open":"");
  el.dataset.id=cmd.id;
  el.innerHTML=`
  <button class="command-head" type="button" aria-expanded="${open}">
    <code class="command-name">${hi(cmd.n,q)}</code>
    <span class="command-desc">${hi(cmd[lang].d,q)}</span>
    <span class="tag tag-${cmd.lv}">${L["tab_"+cmd.lv]}</span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  <div class="command-body"><div class="cb-in"><div class="cb-pad">
    <p class="cmd-about">${esc(cmd[lang].a)}</p>
    ${codeBlock(cmd)}
    ${cmd[lang].t?tipBox(cmd[lang].t):""}
  </div></div></div>`;
  el.querySelector(".command-head").addEventListener("click",()=>{
    const now=!el.classList.contains("open");
    el.classList.toggle("open",now);
    el.querySelector(".command-head").setAttribute("aria-expanded",now);
    now?state.open.add(cmd.id):state.open.delete(cmd.id);
  });
  return el;
}

function render(){
  const q=state.query.trim().toLowerCase(), L=I18N[state.lang];
  const box=$("#commands"); box.innerHTML="";
  let shown=0;
  for(const lv of ORDER){
    if(state.level!=="all"&&state.level!==lv)continue;
    const list=C.filter(c=>c.lv===lv&&(!q||c.hay.includes(q)));
    if(!list.length)continue;
    const h=document.createElement("div");
    h.className="sec-head";
    h.innerHTML=`<h2>${LV[lv].e} <span>${L["sec_"+lv]}</span></h2><span class="bar" aria-hidden="true"></span>`;
    box.appendChild(h);
    list.forEach(c=>{box.appendChild(card(c,q));shown++});
  }
  $("#noResults").hidden=shown>0;
  $("#live").textContent=q?shown+" "+L.results:"";
}

function buildStats(){
  const L=I18N[state.lang];
  const counts={all:C.length,basic:0,intermediate:0,advanced:0,expert:0};
  C.forEach(c=>counts[c.lv]++);
  $("#stats").innerHTML=["all","basic","intermediate","advanced","expert"]
    .map(k=>`<span class="stat">${LV[k].e} <b>${counts[k]}</b> ${L["tab_"+k]}</span>`).join("");
}

function buildCotd(){
  const L=I18N[state.lang], cmd=C[cotdSeed%C.length];
  $("#cotdRow").innerHTML=`
  <button class="cotd" id="cotdGo" type="button">
    <span class="cotd-label">✨ ${L.cotd}</span>
    <code>${esc(cmd.n)}</code>
    <span class="cotd-desc">${esc(cmd[state.lang].d)}</span>
  </button>
  <button class="cotd-dice" id="cotdDice" type="button" aria-label="🎲">🎲</button>`;
  $("#cotdGo").onclick=()=>goTo(cmd.id);
  $("#cotdDice").onclick=()=>{cotdSeed=Math.floor(Math.random()*C.length);buildCotd()};
}

function goTo(id){
  state.level="all"; state.query=""; searchInput.value="";
  setTabsUI(); state.open.add(id); render();
  requestAnimationFrame(()=>{
    const el=document.querySelector(`[data-id="${id}"]`);
    if(!el)return;
    el.scrollIntoView({behavior:"smooth",block:"center"});
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"),2600);
  });
}

/* ═══════════════════════════════════════════
   اللغة والثيم
   ═══════════════════════════════════════════ */
function applyLang(){
  const L=I18N[state.lang];
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==="ar"?"rtl":"ltr";
  document.title=L.docTitle;
  $$("[data-i]").forEach(e=>e.textContent=L[e.dataset.i]);
  searchInput.placeholder=L.searchPh;
  const lb=$("#langBtn");
  lb.textContent=state.lang==="ar"?"EN":"عربي";
  lb.setAttribute("aria-label",state.lang==="ar"?"Switch to English":"التبديل إلى العربية");
  buildStats(); buildCotd(); render();
}
$("#langBtn").addEventListener("click",()=>{
  state.lang=state.lang==="ar"?"en":"ar";
  localStorage.setItem("reesha-lang",state.lang);
  applyLang();
});

const themeBtn=$("#themeBtn");
function setTheme(t,save=true){
  document.documentElement.dataset.theme=t;
  if(save)localStorage.setItem("reesha-theme",t);
  themeBtn.textContent=t==="dark"?"☀️":"🌙";
  themeBtn.setAttribute("aria-label",t==="dark"?"Switch to light mode":"الوضع الليلي");
}
setTheme(document.documentElement.dataset.theme||"light",false);
themeBtn.addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",e=>{
  if(!localStorage.getItem("reesha-theme"))setTheme(e.matches?"dark":"light",false);
});

/* ═══════════════════════════════════════════
   التفاعلات — تبويبات، بحث، نسخ، اختصارات
   ═══════════════════════════════════════════ */
function setTabsUI(){
  $$(".tab").forEach(b=>{
    const on=b.dataset.level===state.level;
    b.classList.toggle("active",on);
    b.setAttribute("aria-pressed",on);
  });
}
$$(".tab").forEach(b=>b.addEventListener("click",()=>{
  state.level=b.dataset.level; setTabsUI(); render();
}));

$("#expandAll").addEventListener("click",()=>{C.forEach(c=>state.open.add(c.id));render()});
$("#collapseAll").addEventListener("click",()=>{state.open.clear();render()});

searchInput.addEventListener("input",()=>{state.query=searchInput.value;render()});

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();searchInput.focus();searchInput.select()}
  else if(e.key==="/"&&document.activeElement!==searchInput){e.preventDefault();searchInput.focus()}
  else if(e.key==="Escape"){
    searchInput.value=""; state.query=""; state.open.clear();
    searchInput.blur(); render();
  }
});

/* نسخ الكود (تفويض واحد لكل الأزرار) */
document.addEventListener("click",e=>{
  const b=e.target.closest(".copy-btn");
  if(!b)return;
  const txt=b.closest(".code-wrap").querySelector("pre").textContent;
  const ok=()=>{
    b.classList.add("ok");
    b.textContent="✅ "+I18N[state.lang].copied;
    setTimeout(()=>{b.classList.remove("ok");b.textContent="📋 "+I18N[state.lang].copy},1600);
  };
  const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy")}catch(_){}
    document.body.removeChild(ta); ok();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(ok).catch(fallback);
  else fallback();
});

/* شريط التقدم + زر العودة */
const prog=$("#progress"), toTop=$("#toTop");
addEventListener("scroll",()=>{
  const h=document.documentElement;
  prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";
  toTop.classList.toggle("show",h.scrollTop>400);
},{passive:true});
toTop.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));

$("#year").textContent=new Date().getFullYear();
applyLang();
</script>
</body>
</html>
